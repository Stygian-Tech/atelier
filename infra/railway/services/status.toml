[build]
builder = "DOCKERFILE"
dockerfilePath = "/apps/status/Dockerfile"
watchPatterns = ["/apps/status/**", "/packages/design-system/**", "/infra/static-server/**", "/package.json", "/bun.lock", "/turbo.json", "/infra/railway/services/status.toml"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
