[build]
builder = "RAILPACK"
buildCommand = "bun run build --filter=@stygian/atelier-mail-web"
watchPatterns = ["/apps/web/mail/**", "/packages/**", "/package.json", "/bun.lock", "/turbo.json", "/infra/railway/services/mail.toml"]

[deploy]
startCommand = "bun run --cwd apps/web/mail start --hostname 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
