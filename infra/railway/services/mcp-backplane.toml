[build]
builder = "RAILPACK"
buildCommand = "swift build --package-path services/mcp-backplane -c release"
watchPatterns = ["/services/mcp-backplane/**", "/packages/swift/**", "/packages/contracts/**", "/infra/railway/services/mcp-backplane.toml", "/mise.toml"]

[deploy]
startCommand = "services/mcp-backplane/.build/release/atelier-mcp-backplane"
healthcheckPath = "/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
