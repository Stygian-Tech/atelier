[build]
builder = "DOCKERFILE"
dockerfilePath = "/apps/marketing/Dockerfile"
watchPatterns = ["/apps/marketing/**", "/packages/design-system/**", "/infra/static-server/**", "/package.json", "/bun.lock", "/turbo.json", "/.dockerignore", "/infra/railway/services/marketing.toml"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
