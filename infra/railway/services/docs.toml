[build]
builder = "DOCKERFILE"
dockerfilePath = "/apps/docs/Dockerfile"
watchPatterns = ["/apps/docs/**", "/infra/static-server/**", "/package.json", "/bun.lock", "/turbo.json", "/infra/railway/services/docs.toml"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
