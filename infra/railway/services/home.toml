[build]
builder = "DOCKERFILE"
dockerfilePath = "/apps/web/home/Dockerfile"
watchPatterns = ["/apps/web/home/**", "/packages/**", "/package.json", "/bun.lock", "/turbo.json", "/.dockerignore", "/infra/railway/services/home.toml"]

[deploy]
startCommand = "bun run --cwd apps/web/home start --hostname 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
