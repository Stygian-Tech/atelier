[build]
builder = "RAILPACK"
# Fail closed until this workstream provides its Swift package and executable.
buildCommand = "test -f services/calendar-sync/Package.swift && swift build --package-path services/calendar-sync -c release"
watchPatterns = ["/services/calendar-sync/**", "/packages/swift/**", "/infra/railway/services/calendar-sync.toml", "/mise.toml"]

[deploy]
startCommand = "test -x services/calendar-sync/.build/release/atelier-calendar-sync && services/calendar-sync/.build/release/atelier-calendar-sync"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
