name: Atelier
options:
  bundleIdPrefix: diy.atelier
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  minimumXcodeGenVersion: 2.38.0
  xcodeVersion: "16.0"

packages:
  AtelierShared:
    path: Packages/AtelierShared

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targetTemplates:
  AtelierApplication:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    deploymentTargets:
      iOS: "17.0"
      macOS: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: AtelierShared
        product: AtelierAppUI

targets:
  Atelier:
    templates: [AtelierApplication]
    sources: [Sources/AtelierApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: diy.atelier
        PRODUCT_NAME: Atelier
        INFOPLIST_KEY_CFBundleDisplayName: Atelier

  AtelierNotes:
    templates: [AtelierApplication]
    sources: [Sources/AtelierNotesApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: diy.atelier.notes
        PRODUCT_NAME: AtelierNotes
        INFOPLIST_KEY_CFBundleDisplayName: Atelier Notes

  AtelierMail:
    templates: [AtelierApplication]
    sources: [Sources/AtelierMailApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: diy.atelier.mail
        PRODUCT_NAME: AtelierMail
        INFOPLIST_KEY_CFBundleDisplayName: Atelier Mail

  AtelierCalendar:
    templates: [AtelierApplication]
    sources: [Sources/AtelierCalendarApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: diy.atelier.calendar
        PRODUCT_NAME: AtelierCalendar
        INFOPLIST_KEY_CFBundleDisplayName: Atelier Calendar

  AtelierTasks:
    templates: [AtelierApplication]
    sources: [Sources/AtelierTasksApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: diy.atelier.tasks
        PRODUCT_NAME: AtelierTasks
        INFOPLIST_KEY_CFBundleDisplayName: Atelier Tasks

schemes:
  Atelier:
    build:
      targets:
        Atelier: all
  Atelier Notes:
    build:
      targets:
        AtelierNotes: all
  Atelier Mail:
    build:
      targets:
        AtelierMail: all
  Atelier Calendar:
    build:
      targets:
        AtelierCalendar: all
  Atelier Tasks:
    build:
      targets:
        AtelierTasks: all
