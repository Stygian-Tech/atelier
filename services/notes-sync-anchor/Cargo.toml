[package]
name = "notes-sync-anchor"
description = "Trusted anchor process for Atelier Notes collaboration"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Stygian-Tech/atelier"
rust-version = "1.91"

[dependencies]
atelier-sync-protocol = { path = "../../packages/rust/atelier-sync-protocol" }
atelier-sync-transport = { path = "../../packages/rust/atelier-sync-transport" }
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
