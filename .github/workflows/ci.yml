name: CI — Required

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    name: Web, contracts, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:generated
      - run: bun run policy:licenses
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Enforce domain contract coverage
        run: bun run coverage:domains
      - name: Test static-serving and privacy boundaries
        run: bun test infra/static-server/server.test.ts apps/marketing/test/privacy-boundary.test.ts
      - run: bun run build

  swift-linux:
    name: Swift services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift test --package-path packages/swift
      - run: swift test --package-path services/api
      - run: swift test --package-path services/mcp-backplane
      - run: swift test --package-path services/worker
      - run: swift test --package-path services/mail-sync
      - run: swift test --package-path services/calendar-sync

  rust:
    name: Rust collaboration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/rust
            services/notes-sync-anchor
      - run: cargo fmt --manifest-path packages/rust/Cargo.toml --all --check
      - run: cargo fmt --manifest-path services/notes-sync-anchor/Cargo.toml --all --check
      - run: cargo clippy --manifest-path packages/rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path services/notes-sync-anchor/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path packages/rust/Cargo.toml --workspace --all-targets --locked
      - run: cargo test --manifest-path services/notes-sync-anchor/Cargo.toml --all-targets --locked
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-29
          components: llvm-tools-preview
      - name: Install pinned Rust coverage adapter
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Enforce collaboration protocol line and branch coverage
        run: |
          cargo +nightly-2026-08-29 llvm-cov \
            --manifest-path packages/rust/Cargo.toml \
            --package atelier-sync-protocol \
            --package atelier-sync-bindings \
            --all-targets \
            --locked \
            --branch \
            --json \
            --summary-only \
            --output-path /tmp/atelier-rust-coverage.json \
            --fail-under-lines 85
          python3 infra/policy/check_rust_coverage.py /tmp/atelier-rust-coverage.json

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          ./gradlew
          --no-daemon
          --stacktrace
          testDebugUnitTest
          :app-atelier:assembleDebug
          :app-notes:assembleDebug
          :app-mail:assembleDebug
          :app-calendar:assembleDebug
          :app-tasks:assembleDebug
        working-directory: apps/android

  apple-shared:
    name: Apple shared packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/apple/Packages/AtelierShared

  apple-apps:
    name: Apple — ${{ matrix.scheme }} / ${{ matrix.destination }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [Atelier, Atelier Notes, Atelier Mail, Atelier Calendar, Atelier Tasks]
        destination: ["generic/platform=iOS Simulator", "generic/platform=macOS"]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/apple
      - run: >-
          xcodebuild build
          -project Atelier.xcodeproj
          -scheme "${{ matrix.scheme }}"
          -destination "${{ matrix.destination }}"
          CODE_SIGNING_ALLOWED=NO
        working-directory: apps/apple

  migration-policy:
    name: Database and repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test repository policy gates
        run: python3 -m unittest discover -s infra/policy/tests
      - name: Scan for high-confidence credential patterns
        run: python3 infra/policy/scan_secrets.py
      - name: Reject activated production manifests
        run: |
          ! grep -R '"apply"[[:space:]]*:[[:space:]]*true' infra/marque
          ! grep -R 'ATELIER_PRODUCTION_ACTIVATION_APPROVED=1' infra/railway
      - name: Require forward-only migrations
        run: test -n "$(find infra/database/migrations -type f -name '*.sql' -print -quit)"
      - name: Apply PostgreSQL 17 migrations and prove tenant isolation
        run: infra/database/tests/run-postgres17.sh
      - name: Validate Railway contracts
        run: python3 infra/railway/validate.py

  container-builds:
    name: Container — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: marketing
            dockerfile: apps/marketing/Dockerfile
          - name: docs
            dockerfile: apps/docs/Dockerfile
          - name: status
            dockerfile: apps/status/Dockerfile
          - name: home
            dockerfile: apps/web/home/Dockerfile
          - name: notes
            dockerfile: apps/web/notes/Dockerfile
          - name: mail
            dockerfile: apps/web/mail/Dockerfile
          - name: calendar
            dockerfile: apps/web/calendar/Dockerfile
          - name: tasks
            dockerfile: apps/web/tasks/Dockerfile
          - name: api
            dockerfile: services/api/Dockerfile
          - name: worker
            dockerfile: services/worker/Dockerfile
          - name: mail-sync
            dockerfile: services/mail-sync/Dockerfile
          - name: calendar-sync
            dockerfile: services/calendar-sync/Dockerfile
          - name: notes-sync-anchor
            dockerfile: infra/docker/notes-sync-anchor.Dockerfile
          - name: mcp-backplane
            dockerfile: services/mcp-backplane/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
