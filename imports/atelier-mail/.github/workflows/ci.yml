name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test
        working-directory: services/api
